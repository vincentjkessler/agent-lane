name: CCS-016 Freeze Adaptive Baseline

on:
  push:
    branches: [bci-wire]
    paths:
      - 'bci/runs/ccs-016-20260916-ADAPT1/trigger-freeze.json'

permissions:
  contents: write

jobs:
  freeze:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run conventional initial lane
        run: python3 bci/runs/ccs-016-20260916-ADAPT1/conventional/baseline.py
      - name: Run compositional initial lane
        run: python3 bci/runs/ccs-016-20260916-ADAPT1/compositional/engine.py
      - name: Verify equivalence and freeze
        run: python3 bci/runs/ccs-016-20260916-ADAPT1/freeze_harness.py
      - name: Commit frozen outputs and evidence
        run: |
          set -euo pipefail
          git config user.name 'ccs-runtime'
          git config user.email 'ccs-runtime@users.noreply.github.com'
          git add bci/runs/ccs-016-20260916-ADAPT1/conventional/output \
                  bci/runs/ccs-016-20260916-ADAPT1/compositional/output \
                  bci/runs/ccs-016-20260916-ADAPT1/freeze.json
          git commit -m 'CCS-016 freeze both implementations before disruption'
          git push origin HEAD:bci-wire
